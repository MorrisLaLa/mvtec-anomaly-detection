<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="星際防衛">
<meta name="theme-color" content="#05060f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>星際防衛</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 360, H = 640;           // 邏輯解析度（直式）
let scale = 1, offX = 0, offY = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  scale = Math.min(cv.width / W, cv.height / H);
  offX = (cv.width - W * scale) / 2; offY = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize); resize();

// ---------- 音效（WebAudio，第一次觸碰後啟用） ----------
let ac = null;
function beep(freq, dur = .08, type = 'square', vol = .05, slide = 0) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
  g.gain.value = vol; g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}
const sfx = {
  shoot: () => beep(880, .05, 'square', .02, -400),
  boom:  () => beep(160, .25, 'sawtooth', .07, -120),
  hit:   () => beep(300, .08, 'square', .04, -100),
  power: () => { beep(520, .1, 'triangle', .06, 400); },
  hurt:  () => beep(120, .35, 'sawtooth', .09, -80),
};

// ---------- 狀態 ----------
let state = 'title';              // title | play | over
let ship, bullets, ebullets, enemies, parts, items, stars;
let score, wave, waveTimer, spawnLeft, shake, best = 0, t = 0;
try { best = +localStorage.getItem('ss_best') || 0; } catch (e) {}

stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: .3 + Math.random() * 1.7 }));

function reset() {
  ship = { x: W / 2, y: H - 110, tx: W / 2, ty: H - 110, hp: 3, inv: 0, fire: 0, power: 1, powerT: 0, shield: 0 };
  bullets = []; ebullets = []; enemies = []; parts = []; items = [];
  score = 0; wave = 0; waveTimer = 60; spawnLeft = 0; shake = 0;
}

// ---------- 輸入：手指拖曳，飛船跟隨（有偏移，不被手指擋住） ----------
let touch = null;
function pt(e) {
  const r = cv.getBoundingClientRect(), dpr = cv.width / r.width;
  return { x: ((e.clientX - r.left) * dpr - offX) / scale, y: ((e.clientY - r.top) * dpr - offY) / scale };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
  if (ac && ac.state === 'suspended') ac.resume();
  const p = pt(e);
  if (state !== 'play') {
    if (state === 'title' || t - overAt > 40) { reset(); state = 'play'; }
    return;
  }
  touch = { id: e.pointerId, sx: p.x, sy: p.y, shx: ship.x, shy: ship.y };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!touch || e.pointerId !== touch.id || state !== 'play') return;
  const p = pt(e);
  ship.tx = Math.max(18, Math.min(W - 18, touch.shx + (p.x - touch.sx)));
  ship.ty = Math.max(60, Math.min(H - 30, touch.shy + (p.y - touch.sy)));
});
const end = e => { if (touch && e.pointerId === touch.id) touch = null; };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
// 桌機測試用鍵盤
const keys = {};
addEventListener('keydown', e => { keys[e.key] = true; if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') { reset(); state = 'play'; } });
addEventListener('keyup', e => keys[e.key] = false);

// ---------- 產生物 ----------
const TYPES = {
  grunt:  { hp: 1, r: 14, spd: 1.3, pts: 10, col: '#ff5d73' },
  zig:    { hp: 2, r: 14, spd: 1.2, pts: 25, col: '#ffb347' },
  tank:   { hp: 6, r: 22, spd: .7,  pts: 60, col: '#b36bff' },
  boss:   { hp: 60, r: 40, spd: .5, pts: 500, col: '#ff3b3b' },
};
function spawn(type) {
  const d = TYPES[type];
  enemies.push({ type, ...d, maxhp: d.hp, x: 30 + Math.random() * (W - 60), y: -30, ph: Math.random() * 6, cd: 60 + Math.random() * 90, vx: 0 });
}
function nextWave() {
  wave++;
  if (wave % 5 === 0) { spawn('boss'); enemies[enemies.length - 1].x = W / 2; spawnLeft = 0; }
  else spawnLeft = 5 + wave * 2;
}
function burst(x, y, col, n = 14, sp = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = Math.random() * sp + .5;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 20 + Math.random() * 20, col });
  }
}
function drop(x, y) {
  const r = Math.random();
  if (r < .12) items.push({ x, y, k: 'power' });
  else if (r < .18) items.push({ x, y, k: 'heal' });
  else if (r < .23) items.push({ x, y, k: 'shield' });
}

// ---------- 更新 ----------
let overAt = 0;
function update() {
  t++;
  for (const s of stars) { s.y += s.s * (state === 'play' ? 1.6 : .8); if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; if (--p.life <= 0) parts.splice(i, 1); }
  if (shake > 0) shake *= .85;
  if (state !== 'play') return;

  // 鍵盤
  if (!touch) {
    const sp = 5;
    if (keys.ArrowLeft || keys.a) ship.tx -= sp; if (keys.ArrowRight || keys.d) ship.tx += sp;
    if (keys.ArrowUp || keys.w) ship.ty -= sp; if (keys.ArrowDown || keys.s) ship.ty += sp;
    ship.tx = Math.max(18, Math.min(W - 18, ship.tx)); ship.ty = Math.max(60, Math.min(H - 30, ship.ty));
  }
  ship.x += (ship.tx - ship.x) * .35; ship.y += (ship.ty - ship.y) * .35;
  if (ship.inv > 0) ship.inv--;
  if (ship.powerT > 0 && --ship.powerT === 0) ship.power = 1;

  // 自動射擊
  if (--ship.fire <= 0) {
    ship.fire = 11;
    const p = ship.power;
    const lanes = p === 1 ? [0] : p === 2 ? [-7, 7] : [-10, 0, 10];
    for (const dx of lanes) bullets.push({ x: ship.x + dx, y: ship.y - 18, vx: p === 3 ? dx * .06 : 0, vy: -10 });
    sfx.shoot();
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.x += b.vx; b.y += b.vy;
    if (b.y < -10) bullets.splice(i, 1);
  }

  // 波次
  if (!enemies.length && spawnLeft <= 0) { if (--waveTimer <= 0) { nextWave(); waveTimer = 90; } }
  if (spawnLeft > 0 && t % Math.max(18, 50 - wave * 2) === 0) {
    spawnLeft--;
    const r = Math.random();
    spawn(wave > 2 && r < .2 ? 'tank' : wave > 1 && r < .55 ? 'zig' : 'grunt');
  }

  // 敵人
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.type === 'boss') {
      if (e.y < 110) e.y += e.spd * 1.5; else e.x = W / 2 + Math.sin(t / 50) * (W / 2 - 60);
    } else {
      e.y += e.spd + wave * .03;
      if (e.type === 'zig') e.x += Math.sin(t / 15 + e.ph) * 2.2;
      e.x = Math.max(e.r, Math.min(W - e.r, e.x));
    }
    if (--e.cd <= 0 && e.y > 0 && e.y < H - 200) {
      e.cd = e.type === 'boss' ? 45 : 110 + Math.random() * 90 - wave * 3;
      const aim = Math.atan2(ship.y - e.y, ship.x - e.x);
      const shots = e.type === 'boss' ? [-.5, -.25, 0, .25, .5] : e.type === 'grunt' ? [] : [0];
      for (const o of shots) ebullets.push({ x: e.x, y: e.y + e.r, vx: Math.cos(aim + o) * 3, vy: Math.sin(aim + o) * 3 });
      if (e.type === 'grunt' && wave > 3 && Math.random() < .5) ebullets.push({ x: e.x, y: e.y, vx: 0, vy: 3 });
    }
    // 被子彈打中
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
        bullets.splice(j, 1); e.hp--; e.flash = 3; sfx.hit();
        burst(b.x, b.y, '#fff', 3, 2);
      }
    }
    if (e.flash) e.flash--;
    if (e.hp <= 0) {
      score += e.pts; burst(e.x, e.y, e.col, e.type === 'boss' ? 60 : 18, e.type === 'boss' ? 6 : 3.5);
      shake = e.type === 'boss' ? 14 : 4; sfx.boom(); drop(e.x, e.y);
      if (e.type === 'boss') for (let k = 0; k < 3; k++) items.push({ x: e.x + (k - 1) * 30, y: e.y, k: ['power', 'heal', 'shield'][k] });
      enemies.splice(i, 1); continue;
    }
    if (e.y > H + 40) { enemies.splice(i, 1); hurt(); continue; }       // 漏掉扣血
    if (Math.hypot(ship.x - e.x, ship.y - e.y) < e.r + 12) { if (e.type !== 'boss') { e.hp = 0; } hurt(); }
  }
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i]; b.x += b.vx; b.y += b.vy;
    if (b.y > H + 10 || b.y < -10 || b.x < -10 || b.x > W + 10) { ebullets.splice(i, 1); continue; }
    if (Math.hypot(b.x - ship.x, b.y - ship.y) < 12) { ebullets.splice(i, 1); hurt(); }
  }
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i]; it.y += 1.6;
    if (it.y > H + 20) { items.splice(i, 1); continue; }
    if (Math.hypot(it.x - ship.x, it.y - ship.y) < 24) {
      if (it.k === 'power') { ship.power = Math.min(3, ship.power + 1); ship.powerT = 60 * 12; }
      else if (it.k === 'heal') ship.hp = Math.min(5, ship.hp + 1);
      else ship.shield = 60 * 6;
      sfx.power(); score += 5; items.splice(i, 1);
    }
  }
  if (ship.shield > 0) ship.shield--;
}
function hurt() {
  if (ship.inv > 0 || ship.shield > 0) return;
  ship.hp--; ship.inv = 90; shake = 10; sfx.hurt(); burst(ship.x, ship.y, '#6cf', 20, 4);
  if (navigator.vibrate) navigator.vibrate(80);
  if (ship.hp <= 0) {
    state = 'over'; overAt = t; touch = null;
    burst(ship.x, ship.y, '#fff', 50, 6);
    if (score > best) { best = score; try { localStorage.setItem('ss_best', best); } catch (e) {} }
  }
}

// ---------- 繪製 ----------
function drawShip(x, y, col, flip) {
  ctx.save(); ctx.translate(x, y); if (flip) ctx.scale(1, -1);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(16, 14); ctx.lineTo(6, 8); ctx.lineTo(0, 14); ctx.lineTo(-6, 8); ctx.lineTo(-16, 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(-2, -8, 4, 8);
  ctx.restore();
}
function text(s, x, y, size, col = '#fff', align = 'center') {
  ctx.fillStyle = col; ctx.font = `bold ${size}px system-ui,sans-serif`; ctx.textAlign = align; ctx.fillText(s, x, y);
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale, 0, 0, scale, offX + (Math.random() - .5) * shake * scale, offY + (Math.random() - .5) * shake * scale);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a0f2c'); g.addColorStop(1, '#1a0b2e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${.3 + s.s / 3})`; ctx.fillRect(s.x, s.y, s.s, s.s * 2); }

  if (state !== 'title') {
    for (const it of items) {
      const c = { power: '#ffd93b', heal: '#5dff8a', shield: '#5db8ff' }[it.k];
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(it.x, it.y, 11, 0, 7); ctx.fill();
      text({ power: 'P', heal: '+', shield: 'S' }[it.k], it.x, it.y + 5, 14, '#000');
    }
    for (const e of enemies) {
      drawShip(e.x, e.y, e.flash ? '#fff' : e.col, true);
      if (e.type !== 'grunt') {
        ctx.save(); ctx.translate(e.x, e.y); ctx.scale(e.r / 16, e.r / 16);
        ctx.restore();
        ctx.fillStyle = '#0006'; ctx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2, 4);
        ctx.fillStyle = e.col; ctx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2 * e.hp / e.maxhp, 4);
      }
    }
    ctx.fillStyle = '#7ff';
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 12);
    ctx.fillStyle = '#ff6b9d';
    for (const b of ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 7); ctx.fill(); }
    for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / 20); ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, 3, 3); }
    ctx.globalAlpha = 1;
    if (state === 'play') {
      if (ship.inv % 10 < 6) {
        drawShip(ship.x, ship.y, '#4ee1ff');
        ctx.fillStyle = '#ff9f43'; ctx.fillRect(ship.x - 3, ship.y + 14, 6, 6 + Math.random() * 8);
      }
      if (ship.shield > 0) { ctx.strokeStyle = `rgba(93,184,255,${.4 + .4 * Math.sin(t / 5)})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ship.x, ship.y, 26, 0, 7); ctx.stroke(); }
    }
    // HUD
    text('分數 ' + score, 12, 28, 18, '#fff', 'left');
    text('第 ' + Math.max(1, wave) + ' 波', W / 2, 28, 16, '#9ab');
    for (let i = 0; i < ship.hp; i++) text('♥', W - 14 - i * 20, 28, 20, '#ff5d73', 'right');
    if (state === 'play' && !enemies.length && spawnLeft <= 0 && waveTimer > 0) {
      const next = wave + 1;
      text(next % 5 === 0 ? '⚠ BOSS 來襲 ⚠' : `第 ${next} 波`, W / 2, H / 2 - 40, 30, '#ffd93b');
    }
  }

  if (state === 'title') {
    text('星際防衛', W / 2, 190, 44, '#4ee1ff');
    drawShip(W / 2, 270 + Math.sin(t / 20) * 8, '#4ee1ff');
    text('手指在螢幕上拖曳來移動', W / 2, 360, 16, '#cde');
    text('飛船自動射擊・撿道具變強', W / 2, 388, 16, '#cde');
    text('P 火力　+ 補血　S 護盾', W / 2, 416, 15, '#9ab');
    if (t % 60 < 40) text('點一下開始', W / 2, 500, 24, '#ffd93b');
    if (best) text('最高分 ' + best, W / 2, 550, 16, '#9ab');
  } else if (state === 'over') {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    text('遊戲結束', W / 2, 230, 40, '#ff5d73');
    text('分數 ' + score, W / 2, 290, 26);
    text('到達第 ' + wave + ' 波', W / 2, 322, 16, '#cde');
    text((score >= best && score > 0 ? '🏆 新紀錄 ' : '最高分 ') + best, W / 2, 360, 18, '#ffd93b');
    if (t - overAt > 40 && t % 60 < 40) text('點一下再玩一次', W / 2, 450, 22, '#4ee1ff');
  }
  ctx.restore();
}

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

reset();
let last = 0, acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;       // 固定 60 FPS 邏輯，避免高更新率螢幕變快
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(t0 => { last = t0; loop(t0); });
})();
</script>
</body>
</html>
